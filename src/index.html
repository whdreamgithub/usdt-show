<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
    <title>CryptoTracker - 加密货币行情追踪</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <i class="fab fa-bitcoin"></i>
                <span>CryptoTracker</span>
            </div>
            <nav class="nav">
                <ul>
                    <li><a href="#" class="active">市场</a></li>
                    <li><a href="#">交易对</a></li>
                    <li><a href="#">期货</a></li>
                    <li><a href="#">资讯</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <button class="alert-btn"><i class="fas fa-bell"></i></button>
                <div class="search-box">
                    <input type="text" placeholder="搜索币种...">
                    <button><i class="fas fa-search"></i></button>
                </div>
                <select class="language-select">
                    <option value="zh">中文</option>
                    <option value="en">English</option>
                    <option value="ja">日本語</option>
                </select>
            </div>
        </div>
        <div class="ticker-bar">
            <div class="container">
                <div class="ticker-content">
                    <div class="ticker-item">
                        <span class="ticker-label">BTC:</span>
                        <span class="ticker-price">$42,156.78</span>
                        <span class="ticker-change positive">+2.34%</span>
                    </div>
                    <div class="ticker-item">
                        <span class="ticker-label">ETH:</span>
                        <span class="ticker-price">$2,345.67</span>
                        <span class="ticker-change positive">+1.56%</span>
                    </div>
                    <div class="ticker-item">
                        <span class="ticker-label">BNB:</span>
                        <span class="ticker-price">$312.45</span>
                        <span class="ticker-change negative">-0.78%</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <section class="top-ad">
            <div class="container">
                <img src="image/ad-1.jpg">
            </div>
        </section>

        <section class="chart-section">
            <div class="container">
                <div class="chart-container">
                    <div class="chart-box">
                        <h3>BTC/USDT</h3>
                        <div class="chart-placeholder" id="chart1"></div>
                    </div>
                    <div class="chart-box">
                        <h3>ETH/USDT</h3>
                        <div class="chart-placeholder" id="chart2"></div>
                    </div>
                </div>
            </div>
        </section>

        <section class="double-ad">
            <div class="container">
                <div class="ad-grid">
                    <img src="image/ad-1.jpg">
                    <img src="image/ad-1.jpg">
                </div>
            </div>
        </section>

        <section class="custom-chart-placeholder">
            <div class="container">
                <div class="chart-placeholder-box">
                    <span>图表占位</span>
                </div>
            </div>
        </section>

        <section class="market-table">
            <div class="container">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>排名</th>
                                <th>名称</th>
                                <th>价格</th>
                                <th>24h涨跌</th>
                                <th>24h交易量</th>
                                <th>市值</th>
                                <th>7天走势</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- 数据将通过JS动态加载 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <section class="top-ad">
            <div class="container">
                <img src="image/ad-1.jpg">
            </div>
        </section>

        <section class="top-ad">
            <div class="container">
                <img src="image/ad-1.jpg">
            </div>
        </section>

        <section class="chat-section">
            <div class="container">
                <h2>社区讨论</h2>
                <div class="chat-window">
                    <div class="chat-messages">
                        <!-- 消息将通过JS动态加载 -->
                    </div>
                    <div class="chat-input">
                        <input type="text" placeholder="输入消息...">
                        <button><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>
        </section>
    </main>
